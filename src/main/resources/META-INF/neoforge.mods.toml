# ============================================================
# NeoForge Mod Metadata
# ------------------------------------------------------------
# 这个文件里的 ${...} 占位符由 build.gradle 的 processResources 任务
# 从 gradle.properties 注入，不要手动改这里的版本号。
# ============================================================
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="${mod_authors}"
description='''${mod_description}'''

# ------------------------------------------------------------
# 依赖
# ------------------------------------------------------------
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Create 是硬前置：本模组的所有 mixin 都打在 Create 的类上，
# 没有 Create 连启动都过不去。
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.0,7.0)"
    ordering="AFTER"
    side="BOTH"

# AE2 是可选依赖：装了才启用量子环数量限制，没装则整个功能跳过
# （CirMixinPlugin 会在 mixin 加载阶段检查，不装就不加载 MixinQuantumBridge）。
[[dependencies.${mod_id}]]
    modId="ae2"
    type="optional"
    versionRange="[19,)"
    ordering="AFTER"
    side="BOTH"
