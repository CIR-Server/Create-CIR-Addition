# ============================================================
# 构建参数
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# ============================================================
# 模组元信息
# ============================================================
mod_id=create_cir_addition
mod_name=Create CIR Addition
mod_license=CC-BY-SA-4.0
mod_version=3.4.6
mod_group_id=com.cirserver.createciraddition
mod_authors=Real_Infinistar
mod_description=Server-side optimization and network management add-on built for Create-based modpacks.

# ============================================================
# 目标平台
# ============================================================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.265
neo_version_range=[21.1,)
loader_version_range=[4,)

# ============================================================
# 依赖版本（Modrinth Maven 坐标，格式 maven.modrinth:<slug>:<version-id>）
# ------------------------------------------------------------
# 这里用的是 Modrinth 的 version **id**，不是 version_number。
#   create 6.0.10+mc1.21.1  -> UjX6dr61
#   ae2    19.2.18          -> KDnFUmMm
# 用 id 而不是 version_number 的原因：version_number 里可能带 "+"，
# 在某些 Maven 解析器里要转义，id 是一串纯字母数字，不会出问题。
# 换版本时去 https://api.modrinth.com/v2/project/<slug>/version 查新的 id。
# ============================================================
create_version=UjX6dr61
ae2_version=KDnFUmMm

# ============================================================
# Parchment 映射（可选，默认关闭）
# ============================================================
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
