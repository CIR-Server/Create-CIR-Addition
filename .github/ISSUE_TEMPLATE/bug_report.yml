name: Bug 报告 / Bug Report
description: 崩溃、功能异常、性能问题
title: "[Bug] "
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认：
        - 你已经看过 [README](./README.md)
        - 你搜过了已有的 Issue，没有重复
        - 这是**本模组**的问题，不是 Create 或 AE2 自己的问题

  - type: input
    id: mod-version
    attributes:
      label: 模组版本
      description: 模组列表里显示的版本号，或 jar 文件名
      placeholder: "3.3.0"
    validations:
      required: true

  - type: input
    id: create-version
    attributes:
      label: Create 版本
      placeholder: "6.0.10"
    validations:
      required: true

  - type: input
    id: ae2-version
    attributes:
      label: AE2 版本（没装就写「无」）
      placeholder: "19.2.18"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 客户端还是服务端？单人还是多人？客户端的话说下整合包规模
      placeholder: "服务端 / NeoForge 21.1.265 / 140 个模组"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么，预期是什么
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 在 XX 位置放置量子环
        2. 再放第二座
        3. 出现 XXX
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        请贴 `logs/latest.log` 的**文本内容**，不要截图。
        如果日志很大，贴与本模组相关的部分（搜 `Create CIR Addition`），或者用 Gist 链接。
      render: text
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 配置文件
      description: 如果改过 `config/create_cir_addition.toml`，贴一下改动部分
      render: toml
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我确认贴出的日志里没有服务器地址、玩家 UUID 等隐私信息
          required: true
        - label: 我确认这是本模组的问题，不是上游 Create / AE2 的已知问题
          required: true
